<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Pure Black Squircle Base with Double Monochrome Border -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="10" y="10" width="100" height="100" rx="18" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Left Hemisphere: 1989 CERN Geometric Wireframe Arcs -->
  <path d="M60 22C39.0132 22 22 39.0132 22 60C22 80.9868 39.0132 98 60 98" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M60 22C47.5 22 37.5 39.0132 37.5 60C37.5 80.9868 47.5 98 60 98" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6"/>
  <line x1="23" y1="60" x2="60" y2="60" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="28" y1="42" x2="60" y2="42" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
  <line x1="28" y1="78" x2="60" y2="78" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Diagonal Orbital Horizon Ring -->
  <ellipse cx="60" cy="60" rx="44" ry="15" transform="rotate(-24 60 60)" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Center Architectural 'W' Monogram -->
  <path d="M36 47L46 75L60 51L74 75L84 47" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Right Hemisphere: Dissolving Monochrome Particle Nodes -->
  <circle cx="72" cy="25" r="2.8" fill="#FFFFFF"/>
  <circle cx="84" cy="32" r="2.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="93" cy="44" r="3.0" fill="#FFFFFF"/>
  <circle cx="97" cy="60" r="2.6" fill="#FFFFFF"/>
  <circle cx="93" cy="76" r="2.8" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="84" cy="88" r="2.2" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="72" cy="95" r="2.6" fill="#FFFFFF"/>

  <!-- Inner Constellation Particle Dots -->
  <circle cx="76" cy="40" r="1.8" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="86" cy="53" r="1.8" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="86" cy="67" r="1.8" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="76" cy="80" r="1.8" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="60" cy="22" r="3.2" fill="#FFFFFF"/>
  <circle cx="60" cy="98" r="3.2" fill="#FFFFFF"/>
